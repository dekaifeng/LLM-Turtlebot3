name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: turtlebot-command-evaluation --output-dir /tmp/turtlebot3-evaluation

  ros2-humble:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Enable Ubuntu Jammy repositories
        run: |
          sudo add-apt-repository -y universe
          echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" | sudo tee /etc/apt/sources.list.d/jammy-universe.list
          echo "deb http://archive.ubuntu.com/ubuntu jammy-updates main universe" | sudo tee -a /etc/apt/sources.list.d/jammy-universe.list
      - run: sudo apt-get update
      - run: sudo apt-get install -y libunwind-dev
      - run: >-
          sudo apt-get install -y python3-colcon-common-extensions python3-matplotlib
          ros-humble-geometry-msgs ros-humble-std-msgs ros-humble-std-srvs
          ros-humble-turtlebot3-gazebo ros-humble-turtlebot3-navigation2
          ros-humble-navigation2 ros-humble-nav2-bringup ros-humble-slam-toolbox
      - run: colcon build
      - run: colcon test
      - run: colcon test-result --verbose
      - run: scripts/ros_smoke.sh
      - name: Final velocity gate ROS integration
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 scripts/gate_smoke.py
      - run: scripts/navigation_smoke.sh /tmp/turtlebot3-navigation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guarded-navigation
          path: /tmp/turtlebot3-navigation/
